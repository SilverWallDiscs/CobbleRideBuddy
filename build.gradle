plugins {
    id "fabric-loom" version "1.11-SNAPSHOT"
    id "org.jetbrains.kotlin.jvm" version "2.2.20"
    id "maven-publish"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { name = "CobblemonReleases"; url = "https://artefacts.cobblemon.com/releases/" }
}
dependencies {
    minecraft "com.mojang:minecraft:" + project.minecraft_version
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:" + project.loader_version
    modImplementation "net.fabricmc.fabric-api:fabric-api:" + project.fabric_api_version
    modImplementation "net.fabricmc:fabric-language-kotlin:" + project.fabric_kotlin_version
    modImplementation("com.cobblemon:fabric:" + project.cobblemon_version) {
        version { strictly(project.cobblemon_version) }
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
kotlin { jvmToolchain(21) }
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand("version": project.version) }
}
tasks.withType(Jar).configureEach {
    from("LICENSE") { rename { "CobbleRideBuddy-LICENSE" } }
}
